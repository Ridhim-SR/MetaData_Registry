            metadata: storage:inputs/agri_dept/farmer_registration_master_dataset/farmer_registration_field_dictionary.csv
      scheme_physical_financial_progress_dataset:
        category: CAT-3
        owner: Agriculture Department
        steward:
        dataset_type: Administrative
        frequency:
        timeline:
        api_available:
        description: >-
          Physical and financial progress of departmental schemes: target
          allocations against each scheme, budgets received and still
          unspent, and grant-wise bills raised for farmers and vendors
          including their loan and direct benefit transfer details.
        tables:
          target_allocation_v2:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/target_allocation_v2_metadata.csv
          financial_budget_allocation:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/financial_budget_allocation_metadata.csv
          grant_wise_bill_generation:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/grant_wise_bill_generation_metadata.csv
  rural_development_department:
    name: Rural Development Department
    datasets:
      mgnrega:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Citizen Centric
        frequency: yearly
        timeline: 2014-15 to 2025-26
        api_available: N
        description: >-
          Gram Panchayat-level MGNREGA implementation data from the Ministry
          of Rural Development's MIS: job-card registration and workers by
          social category (category_wise_workers), employment demanded/offered
          and persondays (employment_generated), women's bank-account coverage
          (women_joint_accounts), and works, expenditure and persondays by
          work type (work_structure).
        field_dictionary: storage:inputs/rural_development_department/mgnrega/mgnrega_field_dictionary.csv
      mla_lads:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Administrative
        frequency: yearly
        timeline: 2023-27
        api_available: N
        description: >-
          Financial status of works under the Legislative Assembly Area
          Development Fund Scheme (MLA LADS), reported for each Honourable MLA:
          funds carried forward and allocated per constituency, amounts
          sanctioned and awaiting approval, expenditure, and the unspent and
          committed balances, in lakh.
          [विधान मण्डल क्षेत्र विकास निधि योजना]
        tables:
          financial_status:
            source: storage:inputs/rural_development_department/mla_lads/mla_lads_financial_status_schema.csv
            format: csv
            metadata: storage:inputs/rural_development_department/mla_lads/mla_lads_financial_status_metadata.csv
      awas:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Citizen Centric
        frequency:
        timeline:
        api_available: N
        description: >-
          District-wise progress of the Pradhan Mantri Awas Yojana - Gramin
          (PMAY-G) rural housing scheme: households targeted and registered,
          houses sanctioned and completed, with break-ups by social category
          (ST, SC, minorities, PH and others).
        tables:
          pradhan_mantri_awaas_yojana_gramin:
            source: storage:inputs/rural_development_department/awas/awas_pmayg_category_progress_raw_columns.csv
            format: csv
            metadata: storage:inputs/rural_development_department/awas/awas_pmayg_category_progress_raw_columns_metadata.csv
