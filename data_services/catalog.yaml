            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/online_booking_details_metadata.csv
      farmer_registration_master_dataset:
        category: CAT-3
        owner: Agriculture Department
        steward:
        dataset_type: Citizen Centric
        frequency:
        timeline:
        api_available:
        description: >-
          Master record of registered farmers: identity and contact details,
          caste and certificate references, Aadhaar verification status, land
          and scheme eligibility, and the bank account used for direct benefit
          transfers.
