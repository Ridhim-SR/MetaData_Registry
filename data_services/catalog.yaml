# What should be in OpenMetadata. `sync` makes storage and OpenMetadata
# match this file:   python3 -m src.schema_registry.sync
#
# To add or change data: upload the department's file to storage, edit this
# file, open a PR, and run sync after it's merged. See README.
#
# Per dataset (all optional; blank = not set):
#   category      CAT-1 | CAT-2 | CAT-3 | CAT-4
#   dataset_type  Citizen Centric | Administrative
#   owner, steward, frequency, timeline, api_available (Y/N), description
# Per table:
#   source        storage:<key> of the department's file (required)
#   format        postgres_ddl (default) | csv
#   schema        database schema name (default public)
#   metadata      storage:<key> of a business-metadata CSV (optional)
#   allow_column_removal: true   only for a deliberate full refresh that drops
#                                columns -- remove it again after the sync
# A dataset described by one multi-table Field Dictionary file uses
#   field_dictionary: storage:<key>   instead of `tables`.

departments:
  # PWD (vishwakarma) is owned by another team. It is left active here exactly
  # as main has it, so merging this branch into main never comments it out --
  # the catalog is main's source of truth and this branch only adds agri_dept
  # and rural_development_department below. Local runs that must not touch PWD
  # scope themselves instead of editing this file:
  #     python3 -m src.schema_registry.sync --department agri_dept
  pwd:
    name: Public Works Department
    datasets:
      vishwakarma:
        category: CAT-3
        owner: Public Works Department (PWD)
        steward:
        dataset_type: Administrative
        frequency: Daily
        timeline: "01-06-2019 - ongoing"
        api_available:
        description: "System to monitor all activities related to financial management of the sanctioned projects online. It is an end-to-end integration of all financial activities, right from sanction of the project to its completion, including all checks and balances."
        tables:
          vishwakarma_T:
            source: storage:inputs/pwd/vishwakarma/pwd_vishwakarma_full_raw_columns.txt
            format: postgres_ddl
            metadata: storage:inputs/pwd/vishwakarma/pwd_vishwakarma_full_raw_columns_metadata.csv
  agri_dept:
    name: Agriculture Department
    datasets:
      distribution_record_dataset:
        category: CAT-3
        owner: Agriculture Department
        steward:
        dataset_type: Citizen Centric
        frequency:
        timeline:
        api_available:
        description: >-
          Crop sale and booking records for the department's distribution
          schemes: crop sales with central and state subsidy (crop_sales),
          farmer bookings and their repayment schedule (current_booking and
          its farmer details), and the online booking windows that govern how
          many bookings a crop or item may receive.
        tables:
          crop_sales:
            source: storage:inputs/agri_dept/distribution_record_dataset/Distribution_Records_Dataset-12_13_52.csv
            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/crop_sales_metadata.csv
          current_booking:
            source: storage:inputs/agri_dept/distribution_record_dataset/Distribution_Records_Dataset-12_13_52.csv
            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/current_booking_metadata.csv
          current_booking_farmer_details:
            source: storage:inputs/agri_dept/distribution_record_dataset/Distribution_Records_Dataset-12_13_52.csv
            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/current_booking_farmer_details_metadata.csv
          online_booking:
            source: storage:inputs/agri_dept/distribution_record_dataset/Distribution_Records_Dataset-12_13_52.csv
            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/online_booking_metadata.csv
          online_booking_details:
            source: storage:inputs/agri_dept/distribution_record_dataset/Distribution_Records_Dataset-12_13_52.csv
            format: csv
            metadata: storage:inputs/agri_dept/distribution_record_dataset/online_booking_details_metadata.csv
      farmer_registration_master_dataset:
        category: CAT-3
        owner: Agriculture Department
        steward:
        dataset_type: Citizen Centric
        frequency:
        timeline:
        api_available:
        description: >-
          Master record of registered farmers: identity and contact details,
          caste and certificate references, Aadhaar verification status, land
          and scheme eligibility, and the bank account used for direct benefit
          transfers.
        tables:
          farmers:
            source: storage:inputs/agri_dept/farmer_registration_master_dataset/Farmer_Registration_Master_Dataset-12_9_15.csv
            format: csv
            metadata: storage:inputs/agri_dept/farmer_registration_master_dataset/farmer_registration_field_dictionary.csv
      scheme_physical_financial_progress_dataset:
        category: CAT-3
        owner: Agriculture Department
        steward:
        dataset_type: Administrative
        frequency:
        timeline:
        api_available:
        description: >-
          Physical and financial progress of departmental schemes: target
          allocations against each scheme, budgets received and still
          unspent, and grant-wise bills raised for farmers and vendors
          including their loan and direct benefit transfer details.
        tables:
          target_allocation_v2:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/target_allocation_v2_metadata.csv
          financial_budget_allocation:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/financial_budget_allocation_metadata.csv
          grant_wise_bill_generation:
            source: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/Scheme_Physical__Financial_Progress_Dataset-12_30_34.csv
            format: csv
            metadata: storage:inputs/agri_dept/scheme_physical_financial_progress_dataset/grant_wise_bill_generation_metadata.csv
  rural_development_department:
    name: Rural Development Department
    datasets:
      mgnrega:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Citizen Centric
        frequency: yearly
        timeline: 2014-15 to 2025-26
        api_available: N
        description: >-
          Gram Panchayat-level MGNREGA implementation data from the Ministry
          of Rural Development's MIS: job-card registration and workers by
          social category (category_wise_workers), employment demanded/offered
          and persondays (employment_generated), women's bank-account coverage
          (women_joint_accounts), and works, expenditure and persondays by
          work type (work_structure).
        field_dictionary: storage:inputs/rural_development_department/mgnrega/mgnrega_field_dictionary.csv
      mla_lads:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Administrative
        frequency: yearly
        timeline: 2023-27
        api_available: N
        description: >-
          Financial status of works under the Legislative Assembly Area
          Development Fund Scheme (MLA LADS), reported for each Honourable MLA:
          funds carried forward and allocated per constituency, amounts
          sanctioned and awaiting approval, expenditure, and the unspent and
          committed balances, in lakh.
          [विधान मण्डल क्षेत्र विकास निधि योजना]
        tables:
          financial_status:
            source: storage:inputs/rural_development_department/mla_lads/mla_lads_financial_status_schema.csv
            format: csv
            metadata: storage:inputs/rural_development_department/mla_lads/mla_lads_financial_status_metadata.csv
      awas:
        category: CAT-1
        owner: Rural Development Department
        steward:
        dataset_type: Citizen Centric
        frequency:
        timeline:
        api_available: N
        description: >-
          District-wise progress of the Pradhan Mantri Awas Yojana - Gramin
          (PMAY-G) rural housing scheme: households targeted and registered,
          houses sanctioned and completed, with break-ups by social category
          (ST, SC, minorities, PH and others).
        tables:
          pradhan_mantri_awaas_yojana_gramin:
            source: storage:inputs/rural_development_department/awas/awas_pmayg_category_progress_raw_columns.csv
            format: csv
            metadata: storage:inputs/rural_development_department/awas/awas_pmayg_category_progress_raw_columns_metadata.csv
  non_proprietary_data:
    name: Non-Proprietary Data
    datasets:
      night_time_light_ntl_over_india:
        category: CAT-1
        dataset_type:
        owner: National Remote Sensing Centre, ISRO
        source: https://bhuvan-app1.nrsc.gov.in/bhuvan_ntl/
        steward:
        frequency: Annual
        timeline:
        api_available: No
        description: >-
          State-wise annual night-time light (NTL) radiance for India, derived
          from satellite imagery. Source: National Remote Sensing Centre (NRSC),
          ISRO.
        tables:
          NightTimeLight:
            source: storage:inputs/non_proprietary_data/night_time_light_ntl_over_india/NTL_schema_metadata.csv
            format: csv
            metadata: storage:inputs/non_proprietary_data/night_time_light_ntl_over_india/NTL_metadata.csv
