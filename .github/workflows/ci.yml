name: CI

# Runs all three pytest suites on every push and pull request.
#
# None of the suites needs a secret. This was verified before the workflow was
# written: data_services/.env and apps/api/.env were both removed and the full
# suite still passed, so no .env is materialised here.
#
# Safety: Actions checks out a detached HEAD, and environment_for_branch()
# maps "can't tell the branch" -> "local". local/ is this machine's own
# account and refuses anything else, so CI cannot reach the company Wasabi
# (dev/ or prod/) or the shared OpenMetadata at 10.0.96.105 even by accident.
# That is the same branch guard used locally, doing its job here for free.
#
# The 2 skipped data_services tests need MinIO on localhost:9000. They are
# accepted as skips for now; adding a MinIO service is a deliberate follow-up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-services:
    name: data_services (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: data_services
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_services/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -rs prints the reason for each skipped test. Without it a dependency
      # gap is invisible: the first CI run reported "462 passed, 11 skipped"
      # against 502 locally, because openpyxl was missing from
      # requirements.txt and 36 workbook tests skipped without saying why.
      # Skipping is fine; skipping silently is not.
      - name: Run tests
        run: python -m pytest -q --no-header -rs

  apps-api:
    name: apps/api (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --no-header -rs

  data-ingest-api:
    name: apps/data-ingest (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/data-ingest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/data-ingest/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --no-header -rs
